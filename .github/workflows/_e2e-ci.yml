name: _e2e-ci

# Reusable Cypress E2E branch for the unified CI DAG (#560). Called by ci.yml with a
# `selection` telling it how many specs to run:
#
#   pr-specs  ([e2e-test] mode) — only the .cy.ts files this PR added/modified
#   targeted  ([wip] mode)      — PR-changed specs + impact-mapped specs
#   full      (final mode)      — the entire suite, split across 6 shards
#
# The stack-boot / health-check / teardown / artifact logic is ported verbatim from the
# standalone cypress-e2e.yml (#490). What #560 adds: a `plan` job that resolves the spec
# list (expanding impact-map globs against the checkout) and picks the shard count — 6 for
# a full run, 1 for the handful of specs a diagnostic/WIP run touches.
#
# What #559 adds (per-shard fixed-overhead reduction, targeting <5 min wall-clock):
#   - a cross-run GHA layer cache for docker/app/Dockerfile's `dev` image, prebuilt and
#     reused by `docker compose up test_e2e` instead of rebuilt on every shard;
#   - actions/cache for code/api/{vendor,node_modules} + a primed code/webapp/node_modules,
#     bind-mounted in so init.sh skips its cold composer/npm installs;
#   - init.sh skips `l5-swagger:generate` when ENV=e2e (Cypress never reads the Swagger docs);
#   - the cypress-timing summary is Cypress-labelled and rolled up per .cy.ts spec file.

on:
  workflow_call:
    inputs:
      selection:
        description: 'pr-specs | targeted | full'
        required: true
        type: string
      specs:
        description: 'Comma-separated repo-relative spec paths and/or globs (ignored when selection=full)'
        required: false
        type: string
        default: ''

jobs:
  plan:
    name: e2e-plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      specs_json: ${{ steps.plan.outputs.specs_json }}
      spec_count: ${{ steps.plan.outputs.spec_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve spec list and shard count
        id: plan
        working-directory: code/webapp
        env:
          SELECTION: ${{ inputs.selection }}
          SPECS_INPUT: ${{ inputs.specs }}
        run: |
          set -euo pipefail
          resolved=()
          if [ "$SELECTION" = "full" ]; then
            mapfile -t resolved < <(find cypress/e2e -name '*.cy.ts' | sort)
            # 6 shards. #559 measured 8: it moved the *slowest* shard by ~1s (the wall-clock
            # bottleneck is the file-index split's imbalance, not the shard count) for +33%
            # runners — see doc/conventions/testing/testing-strategy.md.
            shards='[1,2,3,4,5,6]'
          else
            IFS=',' read -ra entries <<< "$SPECS_INPUT"
            for raw in "${entries[@]}"; do
              [ -n "$raw" ] || continue
              entry="${raw#code/webapp/}"
              # shell-glob expansion against the checked-out webapp tree
              for match in $entry; do
                [ -f "$match" ] && resolved+=("$match")
              done
            done
            shards='[1]'
          fi
          # de-dup + sort
          mapfile -t resolved < <(printf '%s\n' "${resolved[@]}" | sort -u | sed '/^$/d')
          count=${#resolved[@]}
          echo "selection=$SELECTION, resolved $count spec(s):"
          printf '  %s\n' "${resolved[@]}"
          # _e2e-ci.yml is only ever called once ci.yml's analyze-pr has already decided there
          # IS something to run (e2e_selection != 'none'), so zero resolved specs is always a
          # misconfiguration here — including selection=full, whose spec list comes from
          # `find cypress/e2e -name '*.cy.ts'` and should never legitimately be empty. Failing
          # closed regardless of $SELECTION stops ci-gate from approving a "full" E2E run that
          # actually executed no Cypress tests at all (e.g. the spec directory got wiped).
          if [ "$count" -eq 0 ]; then
            echo "::error::selection=$SELECTION resolved zero Cypress specs — refusing to let ci-gate pass an E2E run that executes nothing (stale impact-map glob, removed spec, or an empty cypress/e2e/ directory)." >&2
            exit 1
          fi
          specs_json=$(printf '%s\n' "${resolved[@]}" | sed '/^$/d' | jq -R . | jq -cs .)
          {
            echo "shards=$shards"
            echo "specs_json=$specs_json"
            echo "spec_count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### e2e-ci plan"
            echo ""
            echo "- **selection**: \`${{ inputs.selection }}\`"
            echo "- **specs resolved**: ${{ steps.plan.outputs.spec_count }}"
            echo "- **shards**: \`${{ steps.plan.outputs.shards }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cypress-e2e-run:
    name: cypress-e2e-run (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.spec_count != '0'
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}

    env:
      COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.e2e.yml"
      E2E_VITE_API_URL: "http://test_e2e:80/api/v1"
      CYPRESS_baseUrl: "http://test_e2e:5173"
      CYPRESS_apiUrl: "http://test_e2e:80/api/v1"
      CYPRESS_FAIL_FAST_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- #559: cut the per-shard fixed overhead (image build + cold installs) ----
      # docker-compose.e2e.yml bind-mounts ./:/app, so anything restored here on the runner
      # is what init.sh and the cypress container see inside the containers. init.sh only
      # installs a dependency dir when it is missing/empty, and the cypress container's
      # `npm install --prefer-offline` becomes a near-no-op, so a warm cache removes the
      # cold `composer install` + `npm install` (×2) from every shard's critical path.
      # Exact combined-lock key, no restore-keys: any lockfile change busts the whole cache
      # and everything reinstalls cold (today's behaviour) rather than running stale.
      # A restored vendor/ can carry a stale optimized classmap when a first-party PHP class
      # moved without a composer.lock change — init.sh runs `composer dump-autoload` (with
      # post-autoload-dump scripts, so `artisan package:discover` also rebuilds the uncached
      # bootstrap/cache/packages.php) on the cache-hit path.
      - name: Restore API + webapp dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            code/api/vendor
            code/api/node_modules
            code/webapp/node_modules
          key: e2e-deps-${{ runner.os }}-${{ hashFiles('code/api/composer.lock', 'code/api/package-lock.json', 'code/webapp/package-lock.json') }}

      - name: Setup Node 24
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      # Cache miss only: prime code/webapp/node_modules so the cypress container's install
      # and init.sh's webapp `npm install` stay cheap. code/api/{vendor,node_modules} are
      # left for init.sh to install in-container on a miss (its existing cold path).
      - name: Install webapp dependencies (cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: code/webapp
        run: npm ci --no-audit --no-fund

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build docker/app/Dockerfile's `dev` target once, backed by a cross-run GHA layer
      # cache, and load it into the daemon as the exact tag docker-compose.e2e.yml expects
      # (image: ${TEST_E2E_IMAGE:-sushigo-test-e2e:dev}). `docker compose up test_e2e` then
      # reuses it instead of rebuilding on every shard. The `dev` target copies no app code
      # (only init.sh + supervisord.conf), so this cache is stable across code-only PRs.
      - name: Build the E2E app image (dev) with a shared layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: dev
          tags: sushigo-test-e2e:dev
          load: true
          cache-from: type=gha,scope=e2e-app-dev
          cache-to: type=gha,mode=max,scope=e2e-app-dev

      # init.sh assumes code/api/.env exists; CI synthesizes it (mirrors `make cypress-run`).
      # APP_ENV=local (not e2e) so the /v1/test|/v1/dev|/v1/devtools/clock route groups and the
      # simulated clock the specs' before() hooks drive are registered; LOG_CHANNEL=stderr so
      # root-owned storage/logs from init.sh don't 500 www-data requests.
      - name: Synthesize code/api/.env for the E2E container
        run: |
          set -euo pipefail
          cp code/api/.env.example code/api/.env
          sed -i -E '/^(APP_ENV|APP_DEBUG|APP_URL|API_URL|DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE|DB_USERNAME|DB_PASSWORD|LOG_CHANNEL|LOG_STACK|QUEUE_CONNECTION|MAIL_MAILER|CLOCK_SIMULATION_ENABLED|CLOCK_SIMULATION_ALLOWED_ENVIRONMENTS|LOGIN_WITH_DEVDEBUG|DEV_LOGIN_ALLOWED_ENVIRONMENTS|LOG_RESET_LINK)=/d' code/api/.env
          {
            echo ""
            echo "# ---- CI E2E overrides (_e2e-ci.yml) ----"
            echo "APP_ENV=local"
            echo "APP_DEBUG=true"
            echo "APP_URL=http://test_e2e"
            echo "API_URL=http://test_e2e"
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=pgsql"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=mydb_e2e"
            echo "DB_USERNAME=admin"
            echo "DB_PASSWORD=admin"
            echo "QUEUE_CONNECTION=sync"
            echo "MAIL_MAILER=log"
            echo "LOG_CHANNEL=stderr"
            echo "LOG_STACK=stderr"
            echo "CLOCK_SIMULATION_ENABLED=true"
            echo "CLOCK_SIMULATION_ALLOWED_ENVIRONMENTS=local,devtest,testing"
            echo "LOGIN_WITH_DEVDEBUG=true"
            echo "DEV_LOGIN_ALLOWED_ENVIRONMENTS=local,dev,devtest"
            echo "LOG_RESET_LINK=true"
          } >> code/api/.env

      - name: Boot PostgreSQL
        run: docker compose $COMPOSE_FILES up -d pgsql

      - name: Wait for PostgreSQL to be ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker compose $COMPOSE_FILES exec -T pgsql pg_isready -U admin -d mydb_e2e >/dev/null 2>&1; then
              echo "PostgreSQL is ready (mydb_e2e reachable)"
              exit 0
            fi
            echo "waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          docker compose $COMPOSE_FILES logs --no-color pgsql || true
          exit 1

      - name: Boot the E2E application stack (Laravel + Vite)
        run: docker compose $COMPOSE_FILES up -d test_e2e

      - name: Wait for Laravel API health
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if ! docker compose $COMPOSE_FILES ps --status running --services | grep -q '^test_e2e$'; then
              echo "test_e2e container is no longer running — init failed" >&2
              docker compose $COMPOSE_FILES logs --no-color test_e2e || true
              exit 1
            fi
            if docker compose $COMPOSE_FILES exec -T test_e2e curl -fsS http://localhost:80/api/v1/health >/dev/null 2>&1; then
              echo "Laravel API is healthy"
              exit 0
            fi
            echo "waiting for Laravel API... ($i/120)"
            sleep 10
          done
          echo "Laravel API did not become healthy in time" >&2
          docker compose $COMPOSE_FILES logs --no-color test_e2e || true
          exit 1

      - name: Wait for Vite dev server
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker compose $COMPOSE_FILES exec -T test_e2e curl -fsS http://localhost:5173 >/dev/null 2>&1; then
              echo "Vite dev server is up"
              exit 0
            fi
            echo "waiting for Vite dev server... ($i/60)"
            sleep 5
          done
          echo "Vite dev server did not come up in time" >&2
          docker compose $COMPOSE_FILES logs --no-color test_e2e || true
          exit 1

      - name: Fix storage permissions (init.sh ran as root)
        run: |
          docker compose $COMPOSE_FILES exec -T -u root test_e2e sh -c '
            chown -R www-data:www-data /app/code/api/storage /app/code/api/bootstrap/cache || true
            chmod -R ug+rwX /app/code/api/storage /app/code/api/bootstrap/cache || true
          '

      - name: Diagnose E2E wiring
        if: matrix.shard == 1
        run: |
          echo "::group::test_e2e env (VITE_/APP_ENV/CLOCK/DB)"
          docker compose $COMPOSE_FILES exec -T test_e2e printenv | grep -E '^(VITE_|APP_ENV|APP_URL|CLOCK_|DB_|DEV_LOGIN|LOGIN_WITH)' | sort || true
          echo "::endgroup::"
          echo "::group::served api-client.ts (resolved VITE_API_URL)"
          docker compose $COMPOSE_FILES exec -T test_e2e curl -fsS "http://localhost:5173/src/lib/api-client.ts" 2>&1 | head -8 || true
          echo "::endgroup::"
          echo "::group::app environment / clock config (artisan)"
          docker compose $COMPOSE_FILES exec -T test_e2e php /app/code/api/artisan tinker --execute '
            echo "env=".app()->environment().PHP_EOL;
            echo "clock.simulation_enabled=".var_export(config("clock.simulation_enabled"), true).PHP_EOL;
          ' 2>&1 | tail -6 || true
          echo "::endgroup::"

      # Round-robin this shard's slice of the plan's resolved spec list (i % shard-count).
      - name: Select this shard's Cypress specs
        id: shard-specs
        working-directory: code/webapp
        env:
          ALL_SPECS_JSON: ${{ needs.plan.outputs.specs_json }}
        run: |
          set -euo pipefail
          mapfile -t all < <(printf '%s' "$ALL_SPECS_JSON" | jq -r '.[]')
          total=${#all[@]}
          count=${{ strategy.job-total }}
          idx=$(( ${{ matrix.shard }} - 1 ))
          sel=()
          for ((i = 0; i < total; i++)); do
            if (( i % count == idx )); then sel+=("${all[$i]}"); fi
          done
          echo "shard ${{ matrix.shard }}/${count}: ${#sel[@]} of ${total} specs"
          printf '%s\n' "${sel[@]}"
          if [ "${#sel[@]}" -eq 0 ]; then
            echo "specs=" >> "$GITHUB_OUTPUT"
          else
            printf -v joined '%s,' "${sel[@]}"
            echo "specs=${joined%,}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Cypress (shard ${{ matrix.shard }}, headless)
        if: steps.shard-specs.outputs.specs != ''
        run: |
          # node_modules is already primed on the host (bind-mounted in), so this install
          # only reconciles anything platform-specific and is near-instant (#559).
          docker compose $COMPOSE_FILES run --rm --no-deps -e CYPRESS_FAIL_FAST_ENABLED cypress \
            "npm install --prefer-offline --no-audit --no-fund && npx cypress run --browser chrome --reporter cypress-multi-reporters --reporter-options configFile=cypress/reporter-config.json --config retries=2,defaultCommandTimeout=15000,requestTimeout=15000,responseTimeout=45000,pageLoadTimeout=120000 --spec '${{ steps.shard-specs.outputs.specs }}'"

      - name: Upload Cypress JUnit timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-junit-shard-${{ matrix.shard }}
          path: code/webapp/cypress/results/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-shard-${{ matrix.shard }}
          path: code/webapp/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect Docker / application logs
        if: failure()
        timeout-minutes: 5
        run: |
          mkdir -p e2e-logs
          run() { timeout 45 "$@"; }
          run docker compose $COMPOSE_FILES ps > e2e-logs/compose-ps.txt 2>&1 || true
          run docker compose $COMPOSE_FILES logs --no-color --timestamps --tail 5000 test_e2e > e2e-logs/test_e2e.compose.log 2>&1 || true
          run docker compose $COMPOSE_FILES logs --no-color --timestamps --tail 2000 pgsql > e2e-logs/pgsql.log 2>&1 || true
          run docker compose $COMPOSE_FILES exec -T test_e2e sh -c 'tail -n 3000 /var/log/supervisor/vite-dev.log' > e2e-logs/vite-dev.log 2>&1 || true
          run docker compose $COMPOSE_FILES exec -T test_e2e sh -c 'tail -n 3000 /var/log/apache2/access.log' > e2e-logs/apache-access.log 2>&1 || true
          run docker compose $COMPOSE_FILES exec -T test_e2e sh -c 'tail -n 3000 /var/log/apache2/error.log' > e2e-logs/apache-error.log 2>&1 || true
          run docker inspect e2e_container > e2e-logs/e2e_container-inspect.json 2>&1 || true

      - name: Upload Docker / application logs (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-docker-logs-shard-${{ matrix.shard }}
          path: e2e-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down the E2E stack
        if: always()
        run: docker compose $COMPOSE_FILES down -v --remove-orphans

  # Auxiliary reporting only — never a merge gate. continue-on-error is at the JOB level so that
  # ANY failure here (a missing/failed artifact download, the timing generator crashing, …) can
  # never fail the _e2e-ci.yml run and block ci-gate over a summary nobody is gating on.
  cypress-timing:
    name: cypress-timing
    runs-on: ubuntu-latest
    needs: [plan, cypress-e2e-run]
    if: always() && needs.plan.outputs.spec_count != '0'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download per-shard JUnit reports
        uses: actions/download-artifact@v4
        with:
          path: cypress-junit
          pattern: cypress-junit-shard-*
          merge-multiple: true

      - name: Publish Cypress slow-spec summary (all shards)
        env:
          TEST_TIMING_LABEL: Cypress
          TEST_TIMING_GROUP_BY_FILE: 'true'
        run: node .github/scripts/test-timing/generate.js cypress-junit/*.xml

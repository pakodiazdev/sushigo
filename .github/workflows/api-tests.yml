name: API Tests (PHPUnit + Coverage)

on:
  pull_request:
  push:
    branches:
      - main
  # Manual-only diagnostic path (#477): lets a maintainer reproduce a with-coverage vs
  # without-coverage timing comparison on demand, without changing what pull_request/push runs.
  workflow_dispatch:
    inputs:
      skip_coverage:
        description: 'Skip coverage collection (diagnostic timing run only)'
        type: boolean
        default: false

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: mydb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: code/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes in code/api
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'code/api/**'
            timing_script:
              - '.github/scripts/test-timing/**'

      # A PR touching only .github/scripts/test-timing/** (like the PR that introduced it) never
      # changes code/api/**, so it must also trip this step on its own — otherwise the parser's
      # own tests could regress without ever running (caught by Codex review on #477/#480).
      # workflow_dispatch is always an explicit, human-requested diagnostic run — never gated by
      # the path filter, which only makes sense for the automatic pull_request/push events.
      - name: Setup Node 24
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.timing_script == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run test-timing script unit tests
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.timing_script == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: node --test .github/scripts/test-timing/tests/*.test.js

      - name: Setup PHP 8.5 with PCOV
        if: steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: pdo_pgsql

      - name: Install Composer dependencies
        if: steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Copy .env and generate app key
        if: steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan passport:keys --ansi

      - name: Run PHPUnit with coverage
        if: (steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch') && inputs.skip_coverage != true
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: mydb_test
        run: php artisan test --coverage --coverage-clover=coverage.xml --log-junit=test-results.xml

      # Diagnostic-only counterpart of the step above (#477): `skip_coverage` can only be true via
      # workflow_dispatch, so this never runs on the normal pull_request/push PR-validation path.
      - name: Run PHPUnit without coverage (diagnostic timing run)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_coverage == true
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: mydb_test
        run: php artisan test --log-junit=test-results.xml

      # Runs with if: always() so a failing/erroring suite still surfaces timing data for
      # diagnosis instead of only the pass/fail signal already visible in the job's own log.
      - name: Publish PHPUnit slow-test summary
        if: always() && (steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
        working-directory: .
        run: node .github/scripts/test-timing/generate.js code/api/test-results.xml

      - name: Upload JUnit test report
        if: always() && (steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-junit-report
          path: code/api/test-results.xml
          retention-days: 7

      - name: Upload coverage report
        if: (steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch') && inputs.skip_coverage != true
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: code/api/coverage.xml
          retention-days: 7

  api-sonar:
    name: api-sonar
    runs-on: ubuntu-latest
    needs: api-tests
    # A skip_coverage diagnostic run (#477) never produces the php-coverage artifact this job
    # downloads below, so it must not run in that case.
    if: needs.api-tests.result == 'success' && inputs.skip_coverage != true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes in code/api
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'code/api/**'

      - name: Download coverage report
        if: steps.changes.outputs.api == 'true'
        uses: actions/download-artifact@v4
        with:
          name: php-coverage
          path: code/api

      - name: SonarCloud Scan (API)
        if: steps.changes.outputs.api == 'true'
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        with:
          projectBaseDir: code/api

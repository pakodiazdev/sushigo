name: CI

# The single PR-validation workflow (#560, #598). One workflow run, one visible dependency graph:
#
#   analyze-pr ──┬─ api-ci        (reusable _api-ci.yml:   swagger + lint → phpunit → [coverage → sonar])
#                ├─ webapp-ci     (reusable _webapp-ci.yml: lint+typecheck → vitest → [coverage → sonar])
#                ├─ e2e-ci        (reusable _e2e-ci.yml:    boot stack → cypress, selection = pr-specs | full)
#                ├─ scripts-tests (node --test for .github/scripts/*)
#                └─ ci-gate       (the ONLY required check — its name never changes with shard counts)
#
# Merge-blocking is GitHub DRAFT status (#598): the issue slash-commands open the PR with
# `gh pr create --draft`, and `/finish-pr` promotes it with `gh pr ready`. A draft PR cannot be
# merged natively — every check still renders green when it passes — so `ci-gate` is SKIPPED on
# drafts (a skipped required check counts as passing; the draft itself blocks the merge).
#
# CI cost while iterating is the developer's explicit choice, via an optional title modifier
# bracket right after `[x]` (doc/conventions/git/pull-requests.md), matched by content,
# case-insensitively:
#   [skip-ci]      — nothing runs, not even lint
#   [ci-check]     — lint/typecheck + only the test files this PR added/modified (the DRAFT default)
#   [ci-check-all] — lint/typecheck + the full suite of every touched surface + full Cypress
#   (no modifier)  — draft => [ci-check] ; ready => [ci-check-all]  (the full regression, gated)
#
# A READY PR whose title still carries [skip-ci] / [ci-check] ran a shallow/suppressed scope:
# `ci-gate` goes RED with a "remove the modifier" message. That is the only non-failure ci-gate red.
#
# The reusable `_api-ci.yml` / `_webapp-ci.yml` / `_e2e-ci.yml` files exist only to keep each
# surface's step order and quality logic isolated and reusable — they are NOT separate runs.
# Branch protection requires only `ci-gate`. deploy-preview / update-iteration-progress /
# wif-smoke-test stay independent (not PR validation).

on:
  pull_request:
    # `edited` re-runs CI on a title-only modifier transition. `ready_for_review` /
    # `converted_to_draft` re-run it on the draft<->ready transition so `ci-gate` (skipped on
    # drafts) and the effective scope re-resolve. analyze-pr is cheap and every heavy branch
    # re-gates on api / webapp / infra / scripts changes and scope, so nothing expensive runs
    # unless the diff warrants it; `concurrency` below supersedes the previous run either way.
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-pr:
    name: analyze-pr
    runs-on: ubuntu-latest
    outputs:
      modifier: ${{ steps.mode.outputs.modifier }}
      is_draft: ${{ steps.mode.outputs.is_draft }}
      run_lint: ${{ steps.mode.outputs.run_lint }}
      test_scope: ${{ steps.mode.outputs.test_scope }}
      e2e_intent: ${{ steps.mode.outputs.e2e_intent }}
      ci_gate: ${{ steps.mode.outputs.ci_gate }}
      shallow_on_ready: ${{ steps.mode.outputs.shallow_on_ready }}
      api_changed: ${{ steps.filter.outputs.api }}
      webapp_changed: ${{ steps.filter.outputs.webapp }}
      infra_changed: ${{ steps.filter.outputs.infra }}
      scripts_changed: ${{ steps.filter.outputs.scripts }}
      api_test_files: ${{ steps.changed-tests.outputs.api_test_files }}
      webapp_test_files: ${{ steps.changed-tests.outputs.webapp_test_files }}
      verify_needed: ${{ steps.scope.outputs.verify_needed }}
      e2e_selection: ${{ steps.e2e.outputs.e2e_selection }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      e2e_reason: ${{ steps.e2e.outputs.e2e_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detect changed surfaces
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            api:
              - 'code/api/**'
            webapp:
              - 'code/webapp/**'
            infra:
              - 'docker-compose.yml'
              - 'docker-compose.e2e.yml'
              - 'docker/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_api-ci.yml'
              - '.github/workflows/_webapp-ci.yml'
              - '.github/workflows/_e2e-ci.yml'
              - '.github/scripts/ci-analyze/**'
            scripts:
              - '.github/scripts/**'

      # `verify_needed=false` == this PR touched no code, test, pipeline or script file —
      # a documentation / non-pipeline-config-only change. ci-gate short-circuits it to a
      # fast green on a ready PR instead of sending the whole arsenal to verify nothing.
      - name: Compute verification scope
        id: scope
        env:
          API: ${{ steps.filter.outputs.api }}
          WEBAPP: ${{ steps.filter.outputs.webapp }}
          INFRA: ${{ steps.filter.outputs.infra }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
        run: node .github/scripts/ci-analyze/print-verify-scope.js

      - name: Resolve execution model (draft status + title modifier)
        id: mode
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
        run: node .github/scripts/ci-analyze/print-mode.js

      - name: Resolve the PR's changed test files (per surface)
        id: changed-tests
        env:
          API_FILES: ${{ steps.filter.outputs.api_files }}
          WEBAPP_FILES: ${{ steps.filter.outputs.webapp_files }}
        run: |
          set -euo pipefail
          [ -n "$API_FILES" ] || API_FILES='[]'
          [ -n "$WEBAPP_FILES" ] || WEBAPP_FILES='[]'
          CHANGED_JSON="$(jq -cn --argjson a "$API_FILES" --argjson b "$WEBAPP_FILES" '$a + $b')"
          export CHANGED_JSON
          node .github/scripts/ci-analyze/print-changed-tests.js

      - name: Resolve Cypress selection
        id: e2e
        env:
          MODE: ${{ steps.mode.outputs.e2e_intent }}
          API_FILES: ${{ steps.filter.outputs.api_files }}
          WEBAPP_FILES: ${{ steps.filter.outputs.webapp_files }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
        run: |
          set -euo pipefail
          [ -n "$API_FILES" ] || API_FILES='[]'
          [ -n "$WEBAPP_FILES" ] || WEBAPP_FILES='[]'
          # Merge the api + webapp changed-file lists into the single JSON array the
          # selector expects (it derives changed .cy.ts specs from this list itself).
          # Drop *.cy.ts paths the PR *deleted* (no longer in the checkout): otherwise a
          # deletion-only PR would still select 'pr-specs' pointing at a missing spec, and
          # _e2e-ci.yml's plan job fails closed on zero resolved. Non-spec deletions are
          # kept — they still count as a code change for the 'full' path.
          MERGED="$(jq -cn --argjson a "$API_FILES" --argjson b "$WEBAPP_FILES" '$a + $b')"
          CHANGED_JSON='[]'
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *.cy.ts) [ -f "$f" ] || { echo "skipping deleted spec: $f"; continue; } ;;
            esac
            CHANGED_JSON="$(jq -c --arg f "$f" '. + [$f]' <<< "$CHANGED_JSON")"
          done < <(jq -r '.[]' <<< "$MERGED")
          export CHANGED_JSON
          node .github/scripts/ci-analyze/print-e2e-selection.js

      - name: Summary
        if: always()
        run: |
          {
            echo "### analyze-pr"
            echo ""
            echo "- **draft**: ${{ steps.mode.outputs.is_draft }} · **modifier**: \`${{ steps.mode.outputs.modifier }}\` · **test scope**: \`${{ steps.mode.outputs.test_scope }}\`"
            echo "- **ci-gate**: \`${{ steps.mode.outputs.ci_gate }}\` · **shallow-on-ready**: ${{ steps.mode.outputs.shallow_on_ready }}"
            echo "- **changed**: api=${{ steps.filter.outputs.api }} · webapp=${{ steps.filter.outputs.webapp }} · infra=${{ steps.filter.outputs.infra }} · scripts=${{ steps.filter.outputs.scripts }}"
            echo "- **changed test files**: api=\`${{ steps.changed-tests.outputs.api_test_files }}\` · webapp=\`${{ steps.changed-tests.outputs.webapp_test_files }}\`"
            echo "- **verify needed**: ${{ steps.scope.outputs.verify_needed }}"
            echo "- **e2e selection**: \`${{ steps.e2e.outputs.e2e_selection }}\` — ${{ steps.e2e.outputs.e2e_reason }}"
            echo "- **e2e specs**: \`${{ steps.e2e.outputs.e2e_specs }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  api-ci:
    name: api-ci
    needs: analyze-pr
    # Skipped entirely under [skip-ci] (run_lint=false). `infra_changed` too: a change to
    # _api-ci.yml / the analyze scripts must exercise the API branch it governs, or the gate
    # could pass on an untested pipeline change.
    if: >-
      needs.analyze-pr.outputs.run_lint == 'true' &&
      (
        needs.analyze-pr.outputs.api_changed == 'true' ||
        needs.analyze-pr.outputs.infra_changed == 'true'
      )
    uses: ./.github/workflows/_api-ci.yml
    with:
      test_scope: ${{ needs.analyze-pr.outputs.test_scope }}
      test_files: ${{ needs.analyze-pr.outputs.api_test_files }}
    secrets: inherit

  webapp-ci:
    name: webapp-ci
    needs: analyze-pr
    if: >-
      needs.analyze-pr.outputs.run_lint == 'true' &&
      (
        needs.analyze-pr.outputs.webapp_changed == 'true' ||
        needs.analyze-pr.outputs.infra_changed == 'true'
      )
    uses: ./.github/workflows/_webapp-ci.yml
    with:
      test_scope: ${{ needs.analyze-pr.outputs.test_scope }}
      test_files: ${{ needs.analyze-pr.outputs.webapp_test_files }}
    secrets: inherit

  # Unit tests for the .github/scripts/* helpers (test-timing report + ci-analyze + sprint-audit).
  # Was api-tests.yml's `api-timing-script-tests` job before that workflow was removed.
  scripts-tests:
    name: scripts-tests
    needs: analyze-pr
    if: >-
      needs.analyze-pr.outputs.run_lint == 'true' &&
      needs.analyze-pr.outputs.scripts_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run .github/scripts unit tests
        run: |
          node --test .github/scripts/test-timing/tests/*.test.js
          node --test .github/scripts/ci-analyze/tests/*.test.js
          node --test .github/scripts/sprint-audit/tests/*.test.js

  e2e-ci:
    name: e2e-ci
    needs: [analyze-pr, api-ci, webapp-ci]
    # Runs when a selection exists AND every applicable quality branch has passed (or was
    # legitimately skipped). `analyze-pr.result == 'success'` is explicit because `always()`
    # disables the implicit needs-success gate — without it a cancelled/failed analyze-pr
    # (empty outputs) would slip past `'' != 'none'` and boot the E2E stack with no selection.
    if: >-
      always() &&
      needs.analyze-pr.result == 'success' &&
      needs.analyze-pr.outputs.e2e_selection != 'none' &&
      (needs.api-ci.result == 'success' || needs.api-ci.result == 'skipped') &&
      (needs.webapp-ci.result == 'success' || needs.webapp-ci.result == 'skipped')
    uses: ./.github/workflows/_e2e-ci.yml
    with:
      selection: ${{ needs.analyze-pr.outputs.e2e_selection }}
      specs: ${{ needs.analyze-pr.outputs.e2e_specs }}
    secrets: inherit

  # The one and only required check. Its name never changes, so branch protection never
  # needs editing when a shard count changes inside a reusable workflow.
  #
  # SKIPPED on a draft PR (`draft != true`): the draft itself blocks the merge, and GitHub
  # treats a skipped required check as satisfied. On a ready PR it evaluates the run.
  ci-gate:
    name: ci-gate
    needs: [analyze-pr, api-ci, webapp-ci, e2e-ci, scripts-tests]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the merge gate
        env:
          ANALYZE: ${{ needs.analyze-pr.result }}
          MODIFIER: ${{ needs.analyze-pr.outputs.modifier }}
          TEST_SCOPE: ${{ needs.analyze-pr.outputs.test_scope }}
          SHALLOW_ON_READY: ${{ needs.analyze-pr.outputs.shallow_on_ready }}
          VERIFY_NEEDED: ${{ needs.analyze-pr.outputs.verify_needed }}
          API: ${{ needs.api-ci.result }}
          WEBAPP: ${{ needs.webapp-ci.result }}
          E2E: ${{ needs.e2e-ci.result }}
          SCRIPTS: ${{ needs.scripts-tests.result }}
        run: |
          set -euo pipefail

          # 1. Fail closed if PR analysis / change detection itself broke (or was cancelled).
          if [ "$ANALYZE" != "success" ]; then
            echo "::error::analyze-pr result was '$ANALYZE' — failing ci-gate closed."
            exit 1
          fi

          # 2. Ready PR still carrying a suppressed/shallow modifier — self-inflicted red
          #    with a clear one-line fix. This is the ONLY ci-gate red that isn't a real
          #    test failure.
          if [ "$SHALLOW_ON_READY" = "true" ]; then
            echo "::error::This PR is marked ready for review, but its title still carries a [$MODIFIER] modifier, so CI ran a suppressed/shallow scope ('$TEST_SCOPE') instead of the full regression. Remove the [skip-ci] / [ci-check] modifier from the title to run the full regression and enable the merge."
            exit 1
          fi

          # 3. Documentation / non-pipeline-config-only PR: nothing to verify.
          if [ "$VERIFY_NEEDED" = "false" ]; then
            echo "No code, test, pipeline or script changes — documentation/config-only PR. Nothing to verify; ci-gate passes."
            exit 0
          fi

          # 4. Full-regression run: every applicable branch must have passed. A legitimately
          #    skipped branch (surface not touched) counts as pass; failure/cancelled does not.
          rc=0
          for pair in "api-ci:$API" "webapp-ci:$WEBAPP" "e2e-ci:$E2E" "scripts-tests:$SCRIPTS"; do
            name="${pair%%:*}"
            res="${pair#*:}"
            case "$res" in
              success|skipped|"") : ;;
              *) echo "::error::$name result was '$res'"; rc=1 ;;
            esac
          done
          if [ "$rc" -eq 0 ]; then
            echo "Full regression passed — this PR is a merge candidate (pending manual review)."
          else
            echo "::error::one or more applicable branches did not pass."
          fi
          exit $rc

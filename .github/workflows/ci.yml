name: CI

# The single PR-validation workflow (#560). One workflow run, one visible dependency graph:
#
#   analyze-pr ──┬─ api-ci        (reusable _api-ci.yml:   swagger + lint → phpunit shards → coverage → sonar)
#                ├─ webapp-ci     (reusable _webapp-ci.yml: lint+typecheck → vitest shards → coverage → sonar)
#                ├─ e2e-ci        (reusable _e2e-ci.yml:    boot stack → cypress, scope = pr-specs | targeted | full)
#                ├─ scripts-tests (node --test for .github/scripts/*)
#                ├─ ci-gate       (quality gate — "did everything that ran pass?", mode-independent)
#                └─ merge-gate    (merge-candidacy check run — "may this PR merge now?")
#
# Both `ci-gate` and `merge-gate` are required status checks. Their names never change with shard
# counts, so branch protection never needs editing when a reusable workflow's job list changes.
#
# Execution mode comes from the PR title's optional third bracket
# (doc/conventions/git/pull-requests.md):
#   [#NNN][x][e2e-test]  — Cypress-only diagnostic loop; merge-gate action_required → never mergeable
#   [#NNN][x][wip]       — quality branches + targeted Cypress; merge-gate action_required → never mergeable
#   [#NNN][x]            — final: quality branches + full Cypress; merge-gate can go green
#
# In wip / e2e-test, `ci-gate` still evaluates quality normally and goes GREEN when the jobs that
# ran passed — so a red ci-gate always means a real failure, never "just wip". `merge-gate` is
# posted (via the Checks API) as `action_required` in those modes: an "action needed" state, not a
# red failure X, that keeps the merge button disabled (action_required is not in GitHub's passing
# set {success, skipped, neutral}). Removing the bracket re-runs CI in final mode and merge-gate is
# posted `success` (iff ci-gate passed).
#
# The reusable `_api-ci.yml` / `_webapp-ci.yml` / `_e2e-ci.yml` files exist only to keep each
# surface's step order and quality logic isolated and reusable — they are NOT separate runs.
# The legacy standalone api-lint / api-swagger / api-tests / webapp-* / cypress-e2e workflows
# were removed once this became the sole gate; branch protection requires `ci-gate` and `merge-gate`.
# deploy-preview / update-iteration-progress / wif-smoke-test stay independent (not PR validation).

on:
  pull_request:
    # `edited` is required so a title-only state transition ([wip] -> final, etc.) re-runs CI.
    # A description/label edit also re-triggers, but analyze-pr is cheap and every heavy branch
    # re-gates on api / webapp / infra / scripts changes and mode, so nothing expensive runs
    # unless the diff warrants it; `concurrency` below supersedes the previous run either way.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-pr:
    name: analyze-pr
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      api_changed: ${{ steps.filter.outputs.api }}
      webapp_changed: ${{ steps.filter.outputs.webapp }}
      infra_changed: ${{ steps.filter.outputs.infra }}
      scripts_changed: ${{ steps.filter.outputs.scripts }}
      verify_needed: ${{ steps.scope.outputs.verify_needed }}
      e2e_selection: ${{ steps.e2e.outputs.e2e_selection }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      e2e_specs_empty: ${{ steps.e2e.outputs.e2e_specs_empty }}
      e2e_reason: ${{ steps.e2e.outputs.e2e_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detect changed surfaces
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            api:
              - 'code/api/**'
            webapp:
              - 'code/webapp/**'
            infra:
              - 'docker-compose.yml'
              - 'docker-compose.e2e.yml'
              - 'docker/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_api-ci.yml'
              - '.github/workflows/_webapp-ci.yml'
              - '.github/workflows/_e2e-ci.yml'
              - '.github/scripts/ci-analyze/**'
              - '.github/e2e-impact-map.json'
            scripts:
              - '.github/scripts/**'

      # `verify_needed=false` == this PR touched no code, test, pipeline or script file —
      # a documentation / non-pipeline-config-only change. ci-gate short-circuits it to a
      # fast green in final mode instead of sending the whole arsenal to verify nothing.
      - name: Compute verification scope
        id: scope
        env:
          API: ${{ steps.filter.outputs.api }}
          WEBAPP: ${{ steps.filter.outputs.webapp }}
          INFRA: ${{ steps.filter.outputs.infra }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
        run: node .github/scripts/ci-analyze/print-verify-scope.js

      - name: Parse execution mode
        id: mode
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/ci-analyze/print-mode.js

      - name: Resolve Cypress selection
        id: e2e
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          API_FILES: ${{ steps.filter.outputs.api_files }}
          WEBAPP_FILES: ${{ steps.filter.outputs.webapp_files }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
        run: |
          set -euo pipefail
          [ -n "$API_FILES" ] || API_FILES='[]'
          [ -n "$WEBAPP_FILES" ] || WEBAPP_FILES='[]'
          # Merge the api + webapp changed-file lists into the single JSON array the
          # selector expects (it derives changed .cy.ts specs from this list itself).
          CHANGED_JSON="$(jq -cn --argjson a "$API_FILES" --argjson b "$WEBAPP_FILES" '$a + $b')"
          export CHANGED_JSON
          node .github/scripts/ci-analyze/print-e2e-selection.js

      - name: Summary
        if: always()
        run: |
          {
            echo "### analyze-pr"
            echo ""
            echo "- **mode**: \`${{ steps.mode.outputs.mode }}\`"
            echo "- **changed**: api=${{ steps.filter.outputs.api }} · webapp=${{ steps.filter.outputs.webapp }} · infra=${{ steps.filter.outputs.infra }} · scripts=${{ steps.filter.outputs.scripts }}"
            echo "- **verify needed**: ${{ steps.scope.outputs.verify_needed }}"
            echo "- **e2e selection**: \`${{ steps.e2e.outputs.e2e_selection }}\` — ${{ steps.e2e.outputs.e2e_reason }}"
            echo "- **e2e specs**: \`${{ steps.e2e.outputs.e2e_specs }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  api-ci:
    name: api-ci
    needs: analyze-pr
    # `infra_changed` too: a change to _api-ci.yml / the analyze scripts must exercise the
    # API branch it governs, or the gate could pass on an untested pipeline change.
    if: >-
      needs.analyze-pr.outputs.mode != 'e2e-test' &&
      (
        needs.analyze-pr.outputs.api_changed == 'true' ||
        needs.analyze-pr.outputs.infra_changed == 'true'
      )
    uses: ./.github/workflows/_api-ci.yml
    secrets: inherit

  webapp-ci:
    name: webapp-ci
    needs: analyze-pr
    if: >-
      needs.analyze-pr.outputs.mode != 'e2e-test' &&
      (
        needs.analyze-pr.outputs.webapp_changed == 'true' ||
        needs.analyze-pr.outputs.infra_changed == 'true'
      )
    uses: ./.github/workflows/_webapp-ci.yml
    secrets: inherit

  # Unit tests for the .github/scripts/* helpers (test-timing report + ci-analyze).
  # Was api-tests.yml's `api-timing-script-tests` job before that workflow was removed.
  # Excluded from [e2e-test]: that mode is the Cypress-only diagnostic loop and must not run
  # anything unrelated to the PR's own specs, even if the PR also touched .github/scripts/**.
  scripts-tests:
    name: scripts-tests
    needs: analyze-pr
    if: >-
      needs.analyze-pr.outputs.mode != 'e2e-test' &&
      needs.analyze-pr.outputs.scripts_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run .github/scripts unit tests
        run: |
          node --test .github/scripts/test-timing/tests/*.test.js
          node --test .github/scripts/ci-analyze/tests/*.test.js

  # [e2e-test] with zero added/modified Cypress specs must fail loudly, not skip green.
  e2e-test-empty-guard:
    name: e2e-test-empty-guard
    needs: analyze-pr
    if: >-
      needs.analyze-pr.outputs.mode == 'e2e-test' &&
      needs.analyze-pr.outputs.e2e_specs_empty == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail — nothing to diagnose
        run: |
          echo "::error::[e2e-test] mode needs at least one Cypress spec added or modified by this PR, but it changed none. Add/adjust a spec, or drop the [e2e-test] title prefix."
          exit 1

  e2e-ci:
    name: e2e-ci
    needs: [analyze-pr, api-ci, webapp-ci]
    # Runs when a selection exists AND either we're in the Cypress-only diagnostic mode
    # (no quality branches to wait on) or every applicable quality branch has passed.
    # `analyze-pr.result == 'success'` is explicit because `always()` disables the implicit
    # needs-success gate — without it a cancelled/failed analyze-pr (empty outputs) would
    # slip past `'' != 'none'` and boot the E2E stack with no selection.
    if: >-
      always() &&
      needs.analyze-pr.result == 'success' &&
      needs.analyze-pr.outputs.e2e_selection != 'none' &&
      (
        needs.analyze-pr.outputs.mode == 'e2e-test' ||
        (
          (needs.api-ci.result == 'success' || needs.api-ci.result == 'skipped') &&
          (needs.webapp-ci.result == 'success' || needs.webapp-ci.result == 'skipped')
        )
      )
    uses: ./.github/workflows/_e2e-ci.yml
    with:
      selection: ${{ needs.analyze-pr.outputs.e2e_selection }}
      specs: ${{ needs.analyze-pr.outputs.e2e_specs }}
    secrets: inherit

  # Required check #1: the quality gate. "Did everything that actually ran pass?" — evaluated the
  # SAME way in every execution mode. It is GREEN on a green [wip] PR; a red ci-gate always means a
  # real lint/test/e2e failure, never "just wip". Merge candidacy is a separate question, answered
  # by `merge-gate` below. Its name never changes, so branch protection never needs editing when a
  # shard count changes inside a reusable workflow.
  ci-gate:
    name: ci-gate
    needs: [analyze-pr, api-ci, webapp-ci, e2e-ci, scripts-tests, e2e-test-empty-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the quality gate
        env:
          ANALYZE: ${{ needs.analyze-pr.result }}
          VERIFY_NEEDED: ${{ needs.analyze-pr.outputs.verify_needed }}
          API: ${{ needs.api-ci.result }}
          WEBAPP: ${{ needs.webapp-ci.result }}
          E2E: ${{ needs.e2e-ci.result }}
          SCRIPTS: ${{ needs.scripts-tests.result }}
          GUARD: ${{ needs.e2e-test-empty-guard.result }}
        run: |
          set -euo pipefail

          # 1. Fail closed if PR analysis / change detection itself broke (or was cancelled).
          if [ "$ANALYZE" != "success" ]; then
            echo "::error::analyze-pr result was '$ANALYZE' — failing ci-gate closed."
            exit 1
          fi

          # 2. Any dependency that actually RAN and did not pass fails ci-gate — checked BEFORE the
          #    docs short-circuit below, so a failing `e2e-test-empty-guard` (an [e2e-test] PR with
          #    no changed specs) can never slip through as green just because `verify_needed=false`.
          #    A legitimately skipped branch (surface not touched, or a whole surface skipped in
          #    [e2e-test] mode) counts as pass; failure/cancelled/timed_out does not. Mode-independent
          #    — [wip] with green targeted branches passes here exactly like final mode does.
          rc=0
          for pair in "api-ci:$API" "webapp-ci:$WEBAPP" "e2e-ci:$E2E" "scripts-tests:$SCRIPTS" "e2e-test-empty-guard:$GUARD"; do
            name="${pair%%:*}"
            res="${pair#*:}"
            case "$res" in
              success|skipped|"") : ;;
              *) echo "::error::$name result was '$res'"; rc=1 ;;
            esac
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::one or more applicable branches did not pass."
            exit 1
          fi

          # 3. Nothing failed. Documentation / non-pipeline-config-only PR: note it and pass.
          if [ "$VERIFY_NEEDED" = "false" ]; then
            echo "No code, test, pipeline or script changes — documentation/config-only PR. Nothing to verify; ci-gate passes."
            exit 0
          fi

          echo "all applicable branches passed."
          exit 0

  # Required check #2: the merge-candidacy gate. "May this PR merge right now?"
  #
  # Posted via the Checks API (not a job exit code) so it can carry an `action_required`
  # conclusion, which a job's exit code cannot produce:
  #
  #   * final mode, ci-gate passed → conclusion: success          (merge candidate, pending review)
  #   * final mode, ci-gate failed → conclusion: failure
  #   * [wip] / [e2e-test]         → conclusion: action_required  (blocks merge — action_required
  #                                   is NOT in GitHub's passing set {success, skipped, neutral} —
  #                                   and renders as an "action needed" state, not a red failure X,
  #                                   so "held for [wip]" reads differently from "a check failed")
  #   * analyze-pr failed          → conclusion: failure          (fails closed like ci-gate)
  #
  # NB: `neutral` and `skipped` both COUNT AS PASSING for a required status check, so neither
  # would block the merge here — `action_required` is the least-alarming conclusion that does.
  #
  # NB: this whole pipeline assumes **same-repo** PRs (dev-lab workspace clones push branches
  # straight to this repo — fork contributions are not a supported path; there is no
  # `pull_request_target` companion by design). A `pull_request` from a fork gets a read-only
  # GITHUB_TOKEN, so `checks.create` cannot post `merge-gate`. The step then FAILS this job with an
  # explicit "fork PRs unsupported" message — a loud, named signal — and the required `merge-gate`
  # context also never reports, so the fork PR is doubly blocked. A maintainer who wants to land
  # fork work re-pushes it from a same-repo branch.
  #
  # Branch protection must require the context `merge-gate`. Neither job below is *named*
  # `merge-gate`, so their own auto check runs do not collide with the `merge-gate` check run they
  # post via the Checks API.
  #
  # TWO jobs post `merge-gate`, and the last write on a SHA wins:
  #
  #   merge-gate-hold   — NO `needs`, so it starts the instant the workflow is scheduled. It parses
  #                       the execution mode straight from the PR title (same regexes as
  #                       ci-analyze/parse-mode.js) and, for a `[wip]` / `[e2e-test]` title, posts
  #                       `action_required` immediately. It exists to close a race: adding `[wip]`
  #                       to an already-final PR is a title-only edit (no new commit), so the prior
  #                       `merge-gate: success` stays valid on that SHA until something overwrites
  #                       it. Not waiting for `analyze-pr` or `ci-gate` shrinks that window to the
  #                       irreducible GitHub-Actions event→runner latency (~10-20s) — it cannot be
  #                       driven to zero by any workflow. For a final title this job posts nothing;
  #                       `merge-gate-report` owns that verdict, and "no merge-gate yet on the new
  #                       state" fails safe (branch protection shows the context pending → blocked).
  #   merge-gate-report — needs [analyze-pr, ci-gate]. The authoritative verdict: `success` in
  #                       final mode iff `ci-gate` passed, `failure` if `ci-gate` failed or
  #                       `analyze-pr` broke; re-posts `action_required` for wip / e2e-test
  #                       (idempotent with the hold).
  merge-gate-hold:
    name: merge-gate-hold
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Post merge-gate (interim hold)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const rawTitle = pr?.title || '';
            // Same tokens ci-analyze/parse-mode.js recognises; [e2e-test] wins over [wip].
            const mode = /\[\s*e2e-test\s*\]/i.test(rawTitle) ? 'e2e-test'
                       : /\[\s*wip\s*\]/i.test(rawTitle) ? 'wip'
                       : 'final';
            if (mode === 'final') {
              core.info('final-mode title — merge-gate-report owns the verdict; hold posts nothing.');
              return;
            }

            const conclusion = 'action_required';
            const title = `Held — remove the [${mode}] title bracket to enable merge`;
            const summary = [
              `This PR is in **${mode}** mode, so it is deliberately not a merge candidate yet.`,
              '`ci-gate` still reflects real quality; this gate is not failed — it just requires',
              'an action: drop the execution-mode bracket from the PR title to re-run CI in final mode.',
            ].join('\n\n');

            if (pr && pr.head?.repo?.full_name !== pr.base?.repo?.full_name) {
              core.setFailed(
                'Fork PRs are not supported by this pipeline: the GITHUB_TOKEN on a fork-triggered ' +
                '`pull_request` run is read-only, so the required `merge-gate` check cannot be posted. ' +
                'Re-push this work from a branch in pakodiazdev/sushigo to run CI.'
              );
              return;
            }
            const sha = pr?.head?.sha ?? context.sha;
            try {
              await github.rest.checks.create({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'merge-gate', head_sha: sha, status: 'completed', conclusion,
                output: { title, summary },
              });
            } catch (err) {
              core.setFailed(`merge-gate could not be posted: ${err.message}`);
              return;
            }
            core.info(`merge-gate (hold) → ${conclusion} @ ${sha}`);

  merge-gate-report:
    name: merge-gate-report
    needs: [analyze-pr, ci-gate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Post merge-gate (final verdict)
        uses: actions/github-script@v7
        env:
          MODE: ${{ needs.analyze-pr.outputs.mode }}
          ANALYZE: ${{ needs.analyze-pr.result }}
          CI_GATE: ${{ needs.ci-gate.result }}
        with:
          script: |
            const mode = process.env.MODE || '';
            const analyze = process.env.ANALYZE || '';
            const ciGate = process.env.CI_GATE || '';

            let conclusion, title, summary;
            if (analyze !== 'success') {
              conclusion = 'failure';
              title = 'analyze-pr did not succeed';
              summary = `analyze-pr concluded \`${analyze}\` — failing merge-gate closed.`;
            } else if (mode === 'wip' || mode === 'e2e-test') {
              conclusion = 'action_required';
              title = `Held — remove the [${mode}] title bracket to enable merge`;
              summary = [
                `This PR is in **${mode}** mode, so it is deliberately not a merge candidate yet.`,
                '`ci-gate` still reflects real quality; this gate is not failed — it just requires',
                'an action: drop the execution-mode bracket from the PR title to re-run CI in final mode.',
              ].join('\n\n');
            } else if (ciGate === 'success') {
              conclusion = 'success';
              title = 'Merge candidate';
              summary = 'final mode and `ci-gate` passed — this PR is a merge candidate (pending manual review).';
            } else {
              conclusion = 'failure';
              title = 'ci-gate did not pass';
              summary = `\`ci-gate\` concluded \`${ciGate}\` — not a merge candidate.`;
            }

            const pr = context.payload.pull_request;
            if (pr && pr.head?.repo?.full_name !== pr.base?.repo?.full_name) {
              core.setFailed(
                'Fork PRs are not supported by this pipeline: the GITHUB_TOKEN on a fork-triggered ' +
                '`pull_request` run is read-only, so the required `merge-gate` check cannot be posted. ' +
                'Re-push this work from a branch in pakodiazdev/sushigo to run CI.'
              );
              return;
            }
            const sha = pr?.head?.sha ?? context.sha;
            try {
              await github.rest.checks.create({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'merge-gate', head_sha: sha, status: 'completed', conclusion,
                output: { title, summary },
              });
            } catch (err) {
              // A same-repo PR reached here, so `checks: write` should have been granted — a
              // failure now is a real regression (permissions, API outage). Fail loudly rather
              // than leave the required `merge-gate` context silently un-reported.
              core.setFailed(`merge-gate could not be posted: ${err.message}`);
              return;
            }
            core.info(`merge-gate (report) → ${conclusion} @ ${sha}`);

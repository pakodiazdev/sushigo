name: _webapp-ci

# Reusable Webapp quality branch for the unified CI DAG (#560). Called by ci.yml only when
# the PR touched code/webapp/** and the execution mode is [wip] or final.
#
# Quality order:  lint+typecheck ─► vitest shards ─► coverage-merge ─► sonar
#
# Sharding / blob-merge logic ported verbatim from the standalone webapp-tests.yml; the
# per-step `if: changes.outputs.webapp` guards are gone because ci.yml's analyze-pr already
# gated this whole branch.

on:
  workflow_call:

jobs:
  lint:
    name: webapp-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route tree
        run: npm run generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  webapp-tests:
    name: webapp-tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: code/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Sharded across 4 parallel jobs — a single-process full run with V8 coverage
      # accumulates enough GC pressure to hang low-resource runners. Shards write a blob
      # report; webapp-coverage-merge stitches them into one report for SonarCloud.
      - name: Run Vitest shard with coverage
        run: npx vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        with:
          name: webapp-blob-report-${{ matrix.shard }}
          path: code/webapp/.vitest-reports/
          include-hidden-files: true
          retention-days: 1

  webapp-coverage-merge:
    name: webapp-coverage-merge
    runs-on: ubuntu-latest
    needs: webapp-tests
    if: needs.webapp-tests.result == 'success'
    defaults:
      run:
        working-directory: code/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: code/webapp/.vitest-reports
          pattern: webapp-blob-report-*
          merge-multiple: true

      - name: Merge shard reports into final coverage
        run: npx vitest run --mergeReports=.vitest-reports --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: webapp-coverage
          path: code/webapp/coverage/
          retention-days: 7

  webapp-sonar:
    name: webapp-sonar
    runs-on: ubuntu-latest
    needs: webapp-coverage-merge
    if: needs.webapp-coverage-merge.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: webapp-coverage
          path: code/webapp/coverage

      - name: SonarCloud Scan (Webapp)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WEBAPP }}
        with:
          projectBaseDir: code/webapp

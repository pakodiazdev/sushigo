name: _webapp-ci

# Reusable Webapp quality branch for the unified CI DAG (#560, #598). Called by ci.yml only
# when the PR touched code/webapp/** (or pipeline infra) and the run is not [skip-ci].
#
# Quality order:  lint+typecheck ─► vitest ─► [coverage-merge ─► sonar]   (full scope only)
#
#   test_scope = full     — all specs, 4 shards, coverage + Sonar (the ready / [ci-check-all] run)
#   test_scope = changed  — only `test_files` (the PR's own changed *.test.ts(x)), 1 shard, NO
#                           coverage, NO Sonar (the draft default / [ci-check] fast loop)
#
# Sharding / blob-merge logic ported verbatim from the standalone webapp-tests.yml; the
# per-step `if: changes.outputs.webapp` guards are gone because ci.yml's analyze-pr already
# gated this whole branch.

on:
  workflow_call:
    inputs:
      test_scope:
        description: 'full | changed'
        required: false
        type: string
        default: 'full'
      test_files:
        description: 'Comma-separated repo-relative Vitest *.test.ts(x) paths (used when test_scope=changed)'
        required: false
        type: string
        default: ''

jobs:
  lint:
    name: webapp-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route tree
        run: npm run generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  webapp-tests:
    name: webapp-tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # 4 shards for a full run; 1 for the [ci-check] changed-file list.
        shard: ${{ fromJson(inputs.test_scope == 'full' && '[1,2,3,4]' || '[1]') }}
    defaults:
      run:
        working-directory: code/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Sharded across 4 parallel jobs — a single-process full run with V8 coverage
      # accumulates enough GC pressure to hang low-resource runners. Shards write a blob
      # report; webapp-coverage-merge stitches them into one report for SonarCloud.
      - name: Run Vitest shard with coverage (full scope)
        if: inputs.test_scope == 'full'
        run: npx vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # changed scope ([ci-check]): only the PR's own changed *.test.ts(x), no coverage,
      # no blob report, no Sonar downstream — a fast loop. Zero resolved files => no-op.
      - name: Run Vitest (changed scope, no coverage)
        if: inputs.test_scope != 'full'
        env:
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          set -euo pipefail
          files=()
          IFS=',' read -ra raw <<< "$TEST_FILES"
          for f in "${raw[@]}"; do
            [ -n "$f" ] || continue
            p="${f#code/webapp/}"
            if [ -f "$p" ]; then
              files+=("$p")
            else
              echo "changed-scope test file not found, skipping: $p"
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "changed scope: no Vitest file from the PR diff — nothing to run"
            exit 0
          fi
          echo "changed scope: ${#files[@]} Vitest file(s) from the PR diff"
          npx vitest run "${files[@]}"

      - name: Upload blob report
        if: inputs.test_scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-blob-report-${{ matrix.shard }}
          path: code/webapp/.vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # coverage + Sonar only on a full-scope run; a [ci-check] loop skips both.
  webapp-coverage-merge:
    name: webapp-coverage-merge
    runs-on: ubuntu-latest
    needs: webapp-tests
    if: inputs.test_scope == 'full' && needs.webapp-tests.result == 'success'
    defaults:
      run:
        working-directory: code/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: code/webapp/.vitest-reports
          pattern: webapp-blob-report-*
          merge-multiple: true

      - name: Merge shard reports into final coverage
        run: npx vitest run --mergeReports=.vitest-reports --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: webapp-coverage
          path: code/webapp/coverage/
          retention-days: 7

  webapp-sonar:
    name: webapp-sonar
    runs-on: ubuntu-latest
    needs: webapp-coverage-merge
    if: inputs.test_scope == 'full' && needs.webapp-coverage-merge.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: webapp-coverage
          path: code/webapp/coverage

      - name: SonarCloud Scan (Webapp)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WEBAPP }}
        with:
          projectBaseDir: code/webapp

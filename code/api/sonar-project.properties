sonar.projectKey=pakodiazdev_sushigo-api
sonar.organization=pakodiazdev-1

# Source & test paths (relative to code/api/)
sonar.sources=app,routes,database
sonar.tests=tests

# Exclusions
sonar.exclusions=vendor/**,storage/**,bootstrap/**,public/**
sonar.coverage.exclusions=database/**,routes/**,tests/**

# PHP coverage — generated by: php artisan test --coverage-clover=coverage.xml
sonar.php.coverage.reportPaths=coverage.xml

sonar.projectKey=pakodiazdev_sushigo-webapp
sonar.organization=pakodiazdev-1

# Source paths (relative to code/webapp/)
sonar.sources=src

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/routeTree.gen.ts
sonar.coverage.exclusions=src/main.tsx,src/pages/**,src/routeTree.gen.ts,src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx

# Test file patterns
sonar.test.inclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# JS/TS coverage — generated by: vitest run --coverage (lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

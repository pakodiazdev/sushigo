services:
  # ✅ Headless (default, profesional)
  test_e2e:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: e2e_container
    working_dir: /app/code
    expose:
      - "80"
      - "443"
      - "5173"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app
      - ./docker/app/config/dev/apache-e2e.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - ENV=e2e
      - VITE_APP_PORT=${VITE_APP_PORT:-5173}
      - CYPRESS_baseUrl=${CYPRESS_baseUrl:-https://sushigo.e2e.local}
      - DB_HOST=pgsql
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-mydb}_e2e
      - POSTGRES_PORT=5432
    extra_hosts:
      - "sushigo.e2e.local:127.0.0.1"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - default

  cypress:
    image: cypress/included:13.17.0
    working_dir: /app/code/webapp
    volumes:
      - .:/app
      - cypress-cache:/root/.cache/Cypress
    environment:
      # Base URL for Cypress tests - can be overridden via .env or command line
      # Options: https://sushigo.e2e.local (via nginx), http://test_e2e:80 (direct), http://dev:5173 (vite dev)
      CYPRESS_baseUrl: ${CYPRESS_baseUrl:-https://sushigo.e2e.local}
    extra_hosts:
      - "sushigo.local:host-gateway"
      - "sushigo.e2e.local:host-gateway"
    depends_on:
      test_e2e:
        condition: service_healthy
    networks:
      - default
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "npm install && npx cypress run" ] # 👀 UI en Docker (VNC/noVNC) para ver los tests en el navegador
  cypress-ui:
    build:
      context: ./docker/e2e-ui
      dockerfile: Dockerfile
    working_dir: /e2e
    container_name: cypress-ui
    volumes:
      - ./code/webapp:/e2e:rw
      - ./docker/app/config/dev/cert:/certs:ro
      - cypress-cache:/root/.cache/Cypress
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CYPRESS_baseUrl: ${CYPRESS_baseUrl:-https://devtest.sushigo.local}
      DISPLAY: :99
      CA_CERT_PATH: /certs/rootCA.pem
    extra_hosts:
      - "devtest.sushigo.local:host-gateway"
      - "devtest.api.sushigo.local:host-gateway"
    networks:
      - default
    ports:
      - "6080:6080" # abrir en navegador: http://localhost:6080
      - "5900:5900" # VNC directo (opcional)
    command: [ "sh", "-c", "npm install && tail -f /dev/null" ]

volumes:
  cypress-cache:

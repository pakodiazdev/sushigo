services:
  preview:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: preview
      args:
        API_URL: "/api/v1"
    volumes:
      - ./docker/app/config/prod/init.sh:/init.sh
      - ./docker/app/config/preview/oauth/oauth-private.key:/run/secrets/oauth_private/value.key:ro
      - ./docker/app/config/preview/oauth/oauth-public.key:/run/secrets/oauth_public/value.key:ro
    container_name: preview_sushigo
    # command: bash /init.sh
    environment:
      - APP_ENV=preview
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - "APP_KEY=${APP_KEY:?APP_KEY must be set, generate one via: cd code/api && php artisan key:generate --show}"
      - APP_URL=http://localhost:8091
      - DB_HOST=${POSTGRES_PREVIEW_HOST:-pgsql}
      - DB_PORT=${POSTGRES_PREVIEW_PORT:-5432}
      - DB_DATABASE=${POSTGRES_PREVIEW_DB:-postgres}
      - DB_USERNAME=${POSTGRES_PREVIEW_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PREVIEW_PASS:-admin}
    ports:
      - "8091:8080"

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/webapp

    # Configuración CORS para el API
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
    Header always set Access-Control-Allow-Credentials "true"
    Header always set Access-Control-Max-Age "3600"

    # SEO Protection: Anti-indexing headers
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Header always set X-Frame-Options "DENY"

    # Gzip compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml
    </IfModule>

    # Habilitar rewrite y proxy
    RewriteEngine On

    # Responder a peticiones OPTIONS (preflight CORS)
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]

    # CRITICAL: Process API and docs routes BEFORE checking for physical files
    # This ensures /docs routes go to Laravel even if there's a docs file/dir in webapp

    # REWRITE: /robots.txt → Laravel robots.txt endpoint (SEO protection for preview)
    RewriteRule ^/robots\.txt$ /var/www/html/api/public/index.php [L,QSA]

    # REWRITE: /api/* → Laravel API endpoints (includes /api/up, /api/v1/*, /api/documentation)
    RewriteRule ^/api/(.*)$ /var/www/html/api/public/index.php [L,QSA]

    # REWRITE: /docs → Laravel API documentation (MUST be before file checking)
    RewriteRule ^/docs/?$ /var/www/html/api/public/index.php [L,QSA]

    # REWRITE: /docs/* → Laravel API documentation with paths (MUST be before file checking)
    RewriteRule ^/docs/(.*)$ /var/www/html/api/public/index.php [L,QSA]

    # Configuración para el directorio del frontend React
    <Directory /var/www/html/webapp>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA Fallback: rutas no-archivo van a index.html
        # SOLO dentro del directorio webapp
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Configuración para el directorio del API Laravel
    <Directory /var/www/html/api/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Laravel maneja el routing internamente via .htaccess
    </Directory>

    # Cache agresivo para assets estáticos (Vite hash)
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>

    # Bloquear acceso a archivos sensibles del API
    <DirectoryMatch "^/var/www/html/api/(storage|vendor|bootstrap|config|database)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
